[project]
name = "graphia"
version = "0.1.0"
description = "Webapp for viewing and exploring knowledge graphs"
readme = "README.md"
authors = [
    { name = "Michele Brigadoi", email = "michele.brigadoi@unibo.it" },
    { name = "Jesper Friis", email = "jesper.friis@sintef.no" },
    { name = "Tor S. Haugland", email = "tor.haugland@sintef.no" },
    { name = "Sylvain Gouttebroze", email = "sylvain.gouttebroze@sintef.no" },
]
requires-python = ">=3.11"
dependencies = [
    #"physmetdoc[excel,callfunctions] @ git+https://github.com/SINTEF/PhysMetDoc.git@main",
    "physmetdoc[excel,callfunctions]>=0.1.0",
]

[project.optional-dependencies]
testing = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
pre-commit = [
    "graphia[testing]",
    "pre-commit==4.6.2",
    "ruff==0.17.3",
]
dev = [
    "graphia[pre-commit]",
    "ipython>=9.0",
    "virtualenvwrapper==6.1.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build]
include = [
    "graphia",
    "graphia/data/*.yaml",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# E/F = standard syntax errors/style (defaults)
# I = import sorting (isort replacement)
# UP = modern Python syntax upgrades
# B = common design flaws, code smells, and subtle bugs
# SIM = simplification opportunities
# S = security (bandit replacement)
# T20 = debugging statement checks (debug-statements replacement)
select = ["E", "F", "I", "UP", "B", "SIM", "S", "T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = [
    "extract_prefixes",
    "oold_converter",
    "tabular",
    "treeweaver",
]
